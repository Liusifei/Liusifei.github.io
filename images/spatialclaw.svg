<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-labelledby="title desc">
<title id="title">SpatialClaw: executable spatial reasoning</title><desc id="desc">A spatial scene is connected to a Python workspace, with a loop to code, inspect, and revise.</desc>
<rect width="720" height="430" rx="16" fill="#e9eee7"/><text x="34" y="46" font-family="Arial,sans-serif" font-size="19" fill="#456459" letter-spacing="2">SPATIALCLAW</text>
