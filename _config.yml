# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Sifei Liu
name: Sifei Liu
position: Principal Research Scientist / Tech Lead
# Email is split into parts so the rendered HTML never contains the full
# address or a mailto: link. It is reassembled client-side (see js/email.js).
email_user: zwrq0star
email_domain: gmail.com
description: >-
  I am a Principal Research Scientist and Tech Lead at [NVIDIA Research](https://www.nvidia.com/en-us/research/), where I work with the [LPR](https://research.nvidia.com/labs/lpr/) team led by [Jan Kautz](https://jankautz.com/). My current research focuses on embodied foundational models, efficient transformer architectures, and spatial reasoning.

  I am deeply involved in VLM and VLA foundation model efforts across [Cosmos](https://www.nvidia.com/en-us/ai/cosmos/) and [Isaac GR00T](https://developer.nvidia.com/project-gr00t).


  Before joining NVIDIA, I earned my Ph.D. at the [VLLAB](http://vllab.ucmerced.edu/) at UC Merced, advised by [Ming-Hsuan Yang](http://faculty.ucmerced.edu/mhyang/). I have been fortunate to receive the Baidu Graduate Fellowship, the NVIDIA Pioneering Research Award, and the Rising Star EECS recognition.
