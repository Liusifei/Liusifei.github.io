- id: gr3d
  title: "Grounded 3D-Aware Spatial Vision-Language Modeling"
  venue: "CVPR 2026"
  description: "GR3D is a spatial vision-language model that unifies explicit 2D, implicit 2D, and monocular 3D grounding in a single framework, decomposing spatial understanding into grounded 2D perception followed by 3D inference."
