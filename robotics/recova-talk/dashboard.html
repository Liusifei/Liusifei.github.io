<!doctype html><html lang="en"><head><meta charset="utf-8"><base href="../recova-slides/"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recova four-workstation dashboard</title><link rel="stylesheet" href="media-v16.css"><link rel="stylesheet" href="fleet-v17.css"><style>
:root{--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:1600px;height:666px;overflow:hidden;background:#f6f5ef;color:#263e2c;font-family:var(--font)}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #ab774b;outline-offset:3px}.slide{width:1600px;height:666px;padding:9px 0 0}.media{position:relative;overflow:hidden;background:#e0e6d9}.media video{display:block;width:100%;height:100%;object-fit:contain}.video-still{display:none}.play-overlay{display:none}.fleet-v17 .mv16-collection{grid-template-columns:550px minmax(0,1fr);gap:17px 39px;padding:0 5px}.fleet-v17 .mv16-flow{height:176px;grid-template-columns:104px minmax(0,1fr) 90px;column-gap:31px}.fleet-v17 .mv16-route{font-size:25px}.fv17-stations{width:1600px;gap:22px}.fv17-station .media{aspect-ratio:4/3}.fv17-station figcaption{margin-top:7px}.fv17-learning{font-size:23px}.mv16-event{font-size:24px}.mv16-film .media{aspect-ratio:16/9}.slide.fleet-v17 .mv16-event{min-height:70px;font-size:22px;padding:6px 12px;line-height:1.25}.fv17-station figcaption button{font-size:23px}.fv17-held{font-size:17px}
</style></head><body><article class="slide fleet-v17"><div class="mv16-collection" data-collection-v16>
      <div class="mv16-film"><div class="media mv16-master"><video autoplay playsinline muted loop preload="none" poster="assets/media/collection-v16.webp" data-speed="1" aria-label="Parallel real-robot data collection"><source src="assets/media/collection-v16.mp4" type="video/mp4"></source></video><img class="video-still" src="assets/media/collection-v16.webp" alt="Parallel real-robot data collection"><button class="play-overlay" aria-label="Play Parallel real-robot data collection">Play clip</button></div><div class="mv16-pins"><button type="button" class="mv16-pin" data-station="1" style="left:33.4%;top:61.2%" aria-label="Follow station 1" aria-pressed="true">1</button><button type="button" class="mv16-pin" data-station="2" style="left:63.4%;top:48.4%" aria-label="Follow station 2" aria-pressed="false">2</button><button type="button" class="mv16-pin" data-station="3" style="left:79.3%;top:37.4%" aria-label="Follow station 3" aria-pressed="false">3</button><button type="button" class="mv16-pin" data-station="4" style="left:90.9%;top:33.8%" aria-label="Follow station 4" aria-pressed="false">4</button></div></div>
      <div class="mv16-orchestration">
        <div class="mv16-flow">
          <svg class="mv16-connections" aria-hidden="true"><path data-wire="delegate"></path><path data-wire="collect"></path></svg>
          <div class="mv16-agent"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><circle cx="4" cy="4" r="2"></circle><circle cx="20" cy="4" r="2"></circle><circle cx="4" cy="20" r="2"></circle><circle cx="20" cy="20" r="2"></circle><path d="m5.5 5.5 4.4 4.4m4.2 0 4.4-4.4m-13 13 4.4-4.4m4.2 0 4.4 4.4"></path></svg><strong>Recova</strong><span>Monitor<br>and delegate</span></div>
          <div class="mv16-routes"><div class="mv16-route" data-route="policy"><span>Run task policy</span><div class="mv16-members"><button type="button" data-station="1" hidden aria-label="Follow station 1">1</button><button type="button" data-station="2" hidden aria-label="Follow station 2">2</button><button type="button" data-station="3" hidden aria-label="Follow station 3">3</button><button type="button" data-station="4" hidden aria-label="Follow station 4">4</button></div></div><div class="mv16-route" data-route="recovery"><span>Invoke recovery</span><div class="mv16-members"><button type="button" data-station="1" hidden aria-label="Follow station 1">1</button><button type="button" data-station="2" hidden aria-label="Follow station 2">2</button><button type="button" data-station="3" hidden aria-label="Follow station 3">3</button><button type="button" data-station="4" hidden aria-label="Follow station 4">4</button></div></div><div class="mv16-route" data-route="human"><span>Request a human</span><div class="mv16-members"><button type="button" data-station="1" hidden aria-label="Follow station 1">1</button><button type="button" data-station="2" hidden aria-label="Follow station 2">2</button><button type="button" data-station="3" hidden aria-label="Follow station 3">3</button><button type="button" data-station="4" hidden aria-label="Follow station 4">4</button></div></div></div>
          <div class="mv16-data"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5Z M8 4v6h8V4M8 20v-7h8v7"></path></svg><strong>Collect<br>data</strong></div>
        </div>
        <div class="fv17-learning"><span>Task data → task policy</span><span>Recovery data → recovery policy</span></div><p class="mv16-event"><strong>Station <span class="mv16-selected">1</span></strong><span class="mv16-decision">Waiting to start a rollout.</span></p>
      </div>
      
    <div class="fv17-stations" aria-label="Four synchronized YAM top camera recordings"><figure class="fv17-station" data-station-id="41" data-station-number="1" data-status="idle"><div class="media fv17-camera"><video autoplay playsinline muted loop preload="none" poster="assets/images/station-41.webp" data-speed="1" aria-label="YAM 1 top camera"><source src="assets/media/station-41.mp4" type="video/mp4"></source></video><img class="video-still" src="assets/images/station-41.webp" alt="YAM 1 top camera"><button class="play-overlay" aria-label="Play YAM 1 top camera">Play clip</button><span class="fv17-held" hidden>Held frame</span></div><figcaption><button type="button" data-station="1" aria-label="Follow YAM 1">YAM 1</button></figcaption></figure><figure class="fv17-station" data-station-id="42" data-station-number="2" data-status="idle"><div class="media fv17-camera"><video autoplay playsinline muted loop preload="none" poster="assets/images/station-42.webp" data-speed="1" aria-label="YAM 2 top camera"><source src="assets/media/station-42.mp4" type="video/mp4"></source></video><img class="video-still" src="assets/images/station-42.webp" alt="YAM 2 top camera"><button class="play-overlay" aria-label="Play YAM 2 top camera">Play clip</button><span class="fv17-held" hidden>Held frame</span></div><figcaption><button type="button" data-station="2" aria-label="Follow YAM 2">YAM 2</button></figcaption></figure><figure class="fv17-station" data-station-id="43" data-station-number="3" data-status="idle"><div class="media fv17-camera"><video autoplay playsinline muted loop preload="none" poster="assets/images/station-43.webp" data-speed="1" aria-label="YAM 3 top camera"><source src="assets/media/station-43.mp4" type="video/mp4"></source></video><img class="video-still" src="assets/images/station-43.webp" alt="YAM 3 top camera"><button class="play-overlay" aria-label="Play YAM 3 top camera">Play clip</button><span class="fv17-held" hidden>Held frame</span></div><figcaption><button type="button" data-station="3" aria-label="Follow YAM 3">YAM 3</button></figcaption></figure><figure class="fv17-station" data-station-id="44" data-station-number="4" data-status="idle"><div class="media fv17-camera"><video autoplay playsinline muted loop preload="none" poster="assets/images/station-44.webp" data-speed="1" aria-label="YAM 4 top camera"><source src="assets/media/station-44.mp4" type="video/mp4"></source></video><img class="video-still" src="assets/images/station-44.webp" alt="YAM 4 top camera"><button class="play-overlay" aria-label="Play YAM 4 top camera">Play clip</button><span class="fv17-held" hidden>Held frame</span></div><figcaption><button type="button" data-station="4" aria-label="Follow YAM 4">YAM 4</button></figcaption></figure></div></div></article><script src="media-v16.js"></script><script src="fleet-v17.js"></script><script>
(()=>{const slide=document.querySelector('.slide'),videos=[...document.querySelectorAll('video')],master=videos[0];videos.forEach(v=>{v.autoplay=false;v.muted=true;v.removeAttribute('autoplay');v.pause();});let active=false;function playback(value){active=value;slide.classList.toggle('active',active);if(active){videos.forEach(v=>{v.preload='auto';if(v.networkState===0)v.load();});master.play().catch(()=>{});}else videos.forEach(v=>v.pause());}window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.type==='recova-playback')playback(e.data.active);});master.addEventListener('canplay',()=>{if(active)master.play().catch(()=>{});});document.addEventListener('visibilitychange',()=>{if(document.hidden)videos.forEach(v=>v.pause());else if(active)master.play().catch(()=>{});});})();
document.addEventListener('keydown',event=>{if(['ArrowRight','ArrowLeft','PageDown','PageUp',' ','n','N','p','P','f','F','o','O','Home','End'].includes(event.key)){event.preventDefault();parent.postMessage({type:'recova-key',key:event.key,shiftKey:event.shiftKey},location.origin);}});
</script></body></html>
