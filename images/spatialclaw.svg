<path d="M212 277 248 257 283 270 247 292Z" fill="#b2946e"/><path d="M212 277V224L248 204 283 217V270L247 292Z" fill="#d7c4a2" stroke="#99774e" stroke-width="2"/><path d="M212 224 247 241 283 217M247 241V292" fill="none" stroke="#99774e" stroke-width="2"/>
