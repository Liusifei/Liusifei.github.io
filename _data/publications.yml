- id: cosmos3
  title: "Cosmos 3: Omnimodal World Models for Physical AI"
  venue: "Technical Report 2026"
  description: "Cosmos 3 is an omnimodal world foundation model that unifies understanding, generation, simulation, and action across text, image, video, audio, and robot actions for Physical AI. It is a large NVIDIA team effort, with Sifei Liu as a core contributor on spatial and embodied capabilities."
  project_page: "https://research.nvidia.com/labs/cosmos-lab/cosmos3/"
