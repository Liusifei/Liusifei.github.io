<g font-family="ui-monospace,monospace" font-size="15"><text x="403" y="148" fill="#a3c8b7"># One cell at a time</text><text x="403" y="181" fill="#e1eae4">reconstruct(frames)</text><text x="403" y="210" fill="#e1eae4">segment(objects)</text><text x="403" y="239" fill="#e1eae4">compare(geometry)</text><text x="403" y="297" fill="#a3c8b7">↳ inspect the result</text></g>
