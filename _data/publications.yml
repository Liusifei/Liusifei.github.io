- id: LoHoManip
  title: "Long-Horizon Manipulation via Trace-Conditioned VLA Planning"
  venue: "arXiv 2026"
  description: "LoHo-Manip is a modular framework that scales short-horizon vision-language-action policies to long-horizon manipulation, using a task-management VLM that predicts subtask sequences and 2D visual traces to guide the executor with implicit progress tracking, replanning, and recovery."
  project_page: "https://www.liuisabella.com/LoHoManip/"
