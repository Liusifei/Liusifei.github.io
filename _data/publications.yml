- id: vesta
  homepage_hidden: true
  title: "Vesta: A Generalist Embodied Reasoning Model"
  venue: "NVIDIA Technical Report, 2026"
  description: "Vesta is a powerful, state-of-the-art Robot System 2 embodied-reasoning VLM that unifies localization, navigation, memory, reasoning, tool use, and long-horizon planning. Across capabilities, it outperforms the strongest single baseline by more than 20% on average and an oracle ensemble of per-category-best baselines by more than 10%, while improving real-robot success by 38.3% on memory-heavy tasks."
  project_page: "https://research.nvidia.com/labs/gear/vesta/"
  arxiv: "2606.20905"
  image: "vesta.png"
  authors_text: "Johan Bjorck, Zhiqi Li, Yunze Man, Jing Wang, An-Chieh Cheng, Sifei Liu, Shihao Wang, Zhiding Yu, Abhishek Badki, Stan Birchfield, Valts Blukis, Yevgen Chebotar, Siyi Chen, Sicong Leng, Yu-Cheng Chou, Tianli Ding, Boyi Li, Zhengyi Luo, Hang Su, Jonathan Tremblay, Tingwu Wang, Bowen Wen, Jimmy Wu, Xianghui Xie, Hanrong Ye, Hongxu Yin, K. R. Zentner, Liangyan Gui, Yu-Xiong Wang, Yuke Zhu, Linxi Fan, Jan Kautz"

